<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"/>
<title>Calculator</title>
<style>
/* Reset everything */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #1a1a2e;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* DISPLAY */
#display {
  background: #0f0f23;
  padding: 10px 14px;
  flex-shrink: 0;
  border-bottom: 3px solid #e94560;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

#exprDiv {
  font-size: 14px;
  color: #888;
  text-align: right;
  min-height: 18px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#numDiv {
  font-size: 42px;
  color: #fff;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.1;
  font-weight: bold;
}

/* BUTTON GRID */
#grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3px;
  padding: 4px;
  overflow: hidden;
}

/* BASE BUTTON STYLE */
.btn {
  border: none;
  border-radius: 8px;
  font-size: 22px;
  font-weight: bold;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  /* MOST IMPORTANT FOR MIT APP INVENTOR */
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  outline: none;
  -webkit-appearance: none;
  /* Prevent text selection on long press */
  -webkit-user-select: none;
  user-select: none;
}

/* Button colors */
.num-btn  { background: #16213e; color: #fff; }
.op-btn   { background: #e94560; color: #fff; }
.eq-btn   { background: #0f3460; color: #fff; font-size: 28px; }
.clr-btn  { background: #533483; color: #fff; font-size: 18px; }
.fn-btn   { background: #1a1a40; color: #00d4ff; font-size: 16px; }

/* Active press feedback */
.num-btn:active  { background: #2a3a5e; }
.op-btn:active   { background: #ff6b81; }
.eq-btn:active   { background: #1a5490; }
.clr-btn:active  { background: #7a4db3; }
.fn-btn:active   { background: #2a2a60; }

.span2 { grid-column: span 2; }
</style>
</head>
<body>

<!-- DISPLAY -->
<div id="display">
  <div id="exprDiv"></div>
  <div id="numDiv">0</div>
</div>

<!-- GRID — using ontouchstart for MIT App Inventor compatibility -->
<div id="grid">

  <!-- Row 1: Scientific -->
  <div class="btn fn-btn" ontouchstart="press('sin');return false;" onclick="press('sin')">sin</div>
  <div class="btn fn-btn" ontouchstart="press('cos');return false;" onclick="press('cos')">cos</div>
  <div class="btn fn-btn" ontouchstart="press('tan');return false;" onclick="press('tan')">tan</div>
  <div class="btn fn-btn" ontouchstart="press('sq');return false;"  onclick="press('sq')">x²</div>

  <!-- Row 2: Scientific -->
  <div class="btn fn-btn" ontouchstart="press('rt');return false;"  onclick="press('rt')">√</div>
  <div class="btn fn-btn" ontouchstart="press('log');return false;" onclick="press('log')">log</div>
  <div class="btn fn-btn" ontouchstart="press('ln');return false;"  onclick="press('ln')">ln</div>
  <div class="btn fn-btn" ontouchstart="press('inv');return false;" onclick="press('inv')">1/x</div>

  <!-- Row 3: Clear + Backspace -->
  <div class="btn clr-btn span2" ontouchstart="press('ac');return false;" onclick="press('ac')">AC</div>
  <div class="btn clr-btn" ontouchstart="press('pm');return false;"  onclick="press('pm')">±</div>
  <div class="btn clr-btn" ontouchstart="press('bs');return false;"  onclick="press('bs')">⌫</div>

  <!-- Row 4: 7 8 9 ÷ -->
  <div class="btn num-btn" ontouchstart="press('7');return false;" onclick="press('7')">7</div>
  <div class="btn num-btn" ontouchstart="press('8');return false;" onclick="press('8')">8</div>
  <div class="btn num-btn" ontouchstart="press('9');return false;" onclick="press('9')">9</div>
  <div class="btn op-btn"  ontouchstart="press('/');return false;"  onclick="press('/')">÷</div>

  <!-- Row 5: 4 5 6 × -->
  <div class="btn num-btn" ontouchstart="press('4');return false;" onclick="press('4')">4</div>
  <div class="btn num-btn" ontouchstart="press('5');return false;" onclick="press('5')">5</div>
  <div class="btn num-btn" ontouchstart="press('6');return false;" onclick="press('6')">6</div>
  <div class="btn op-btn"  ontouchstart="press('*');return false;"  onclick="press('*')">×</div>

  <!-- Row 6: 1 2 3 − -->
  <div class="btn num-btn" ontouchstart="press('1');return false;" onclick="press('1')">1</div>
  <div class="btn num-btn" ontouchstart="press('2');return false;" onclick="press('2')">2</div>
  <div class="btn num-btn" ontouchstart="press('3');return false;" onclick="press('3')">3</div>
  <div class="btn op-btn"  ontouchstart="press('-');return false;"  onclick="press('-')">−</div>

  <!-- Row 7: 0 . = + -->
  <div class="btn num-btn span2" ontouchstart="press('0');return false;" onclick="press('0')">0</div>
  <div class="btn num-btn" ontouchstart="press('.');return false;" onclick="press('.')">.</div>
  <div class="btn op-btn"  ontouchstart="press('+');return false;"  onclick="press('+')">+</div>

  <!-- Row 8: = full width -->
  <div class="btn eq-btn span2" ontouchstart="press('eq');return false;" onclick="press('eq')">=</div>
  <div class="btn fn-btn" ontouchstart="press('pi');return false;"  onclick="press('pi')">π</div>
  <div class="btn fn-btn" ontouchstart="press('pct');return false;" onclick="press('pct')">%</div>

</div>

<script>
// ── STATE ─────────────────────────────────────────────────
var num1      = null;
var pendingOp = null;
var curStr    = '0';
var waitNew   = false;
var ang       = 'deg';

// ── PRESS HANDLER ─────────────────────────────────────────
function press(a) {

  // Digits
  if (a === '0' || a === '1' || a === '2' || a === '3' ||
      a === '4' || a === '5' || a === '6' || a === '7' ||
      a === '8' || a === '9') {
    if (waitNew) {
      curStr = a;
      waitNew = false;
    } else {
      if (curStr === '0') curStr = a;
      else curStr = curStr + a;
    }
    redraw();
    return;
  }

  // Decimal
  if (a === '.') {
    if (waitNew) {
      curStr = '0.';
      waitNew = false;
      redraw();
      return;
    }
    if (curStr.indexOf('.') === -1) {
      curStr = curStr + '.';
    }
    redraw();
    return;
  }

  // Operators
  if (a === '+' || a === '-' || a === '*' || a === '/') {
    var n = parseFloat(curStr);
    if (pendingOp !== null && !waitNew) {
      var mid = doCalc(num1, pendingOp, n);
      if (mid === null) return;
      num1   = mid;
      curStr = fmt(mid);
    } else {
      num1 = n;
    }
    pendingOp = a;
    waitNew   = true;
    showExpr(fmt(num1) + ' ' + symOf(a));
    return;
  }

  // Equals
  if (a === 'eq') {
    if (pendingOp === null || num1 === null) {
      redraw();
      return;
    }
    var n2  = parseFloat(curStr);
    var res = doCalc(num1, pendingOp, n2);
    if (res === null) return;

    var exStr = fmt(num1) + ' ' + symOf(pendingOp) + ' ' + fmt(n2) + ' =';
    curStr    = fmt(res);
    num1      = null;
    pendingOp = null;
    waitNew   = true;
    showResult(exStr);
    return;
  }

  // AC
  if (a === 'ac') {
    curStr    = '0';
    num1      = null;
    pendingOp = null;
    waitNew   = false;
    document.getElementById('exprDiv').innerHTML = '';
    document.getElementById('numDiv').innerHTML  = '0';
    document.getElementById('numDiv').style.color = '#fff';
    return;
  }

  // Backspace
  if (a === 'bs') {
    if (waitNew) {
      curStr = '0'; num1 = null; pendingOp = null; waitNew = false;
    } else if (curStr.length <= 1) {
      curStr = '0';
    } else {
      curStr = curStr.substring(0, curStr.length - 1);
    }
    redraw();
    return;
  }

  // Plus/Minus
  if (a === 'pm') {
    var n3 = parseFloat(curStr);
    curStr = fmt(-n3);
    redraw();
    return;
  }

  // Pi
  if (a === 'pi') {
    curStr  = fmt(3.14159265358979);
    waitNew = true;
    redraw();
    return;
  }

  // Percent
  if (a === 'pct') {
    var n4 = parseFloat(curStr);
    curStr = fmt(n4 / 100);
    waitNew = true;
    redraw();
    return;
  }

  // Scientific functions
  var n5 = parseFloat(curStr);
  if (isNaN(n5)) {
    showErr('Need number');
    return;
  }

  var r;
  var rad = ang === 'deg' ? (3.14159265358979 / 180) : 1;

  if (a === 'sin') { r = Math.sin(n5 * rad); }
  else if (a === 'cos') { r = Math.cos(n5 * rad); }
  else if (a === 'tan') { r = Math.tan(n5 * rad); }
  else if (a === 'sq')  { r = n5 * n5; }
  else if (a === 'rt')  { r = n5 < 0 ? null : Math.sqrt(n5); }
  else if (a === 'log') { r = n5 <= 0 ? null : Math.log(n5) / Math.log(10); }
  else if (a === 'ln')  { r = n5 <= 0 ? null : Math.log(n5); }
  else if (a === 'inv') { r = n5 === 0 ? null : 1 / n5; }
  else { return; }

  if (r === null || isNaN(r) || !isFinite(r)) {
    showErr('Error');
    return;
  }

  r = rd(r);
  curStr  = fmt(r);
  waitNew = true;
  redraw();
}

// ── CALCULATE ─────────────────────────────────────────────
function doCalc(a, op, b) {
  var result;
  if      (op === '+') result = a + b;
  else if (op === '-') result = a - b;
  else if (op === '*') result = a * b;
  else if (op === '/') {
    if (b === 0) { showErr('Div by 0'); return null; }
    result = a / b;
  }
  if (result === undefined || !isFinite(result)) {
    showErr('Overflow');
    return null;
  }
  return rd(result);
}

// ── DISPLAY ───────────────────────────────────────────────
function redraw() {
  var d = document.getElementById('numDiv');
  d.style.color = '#fff';
  d.innerHTML = curStr || '0';
}

function showExpr(expr) {
  redraw();
  document.getElementById('exprDiv').innerHTML = expr;
}

function showResult(expr) {
  var d = document.getElementById('numDiv');
  d.style.color = '#00ff88';
  d.innerHTML = curStr || '0';
  document.getElementById('exprDiv').innerHTML = expr;
  // Flash back to white
  setTimeout(function() {
    d.style.color = '#fff';
  }, 600);
}

function showErr(msg) {
  var d = document.getElementById('numDiv');
  d.style.color = '#ff4060';
  d.innerHTML = msg;
  document.getElementById('exprDiv').innerHTML = '';
  curStr = '0'; num1 = null; pendingOp = null; waitNew = false;
}

// ── HELPERS ───────────────────────────────────────────────
function rd(n) {
  return Math.round(n * 10000000000) / 10000000000;
}

function fmt(n) {
  if (n === null || n === undefined) return '0';
  var r = rd(n);
  if (Math.abs(r) >= 1000000000000 || (Math.abs(r) < 0.00000001 && r !== 0)) {
    return r.toExponential(4);
  }
  return String(r);
}

function symOf(op) {
  if (op === '+') return '+';
  if (op === '-') return '−';
  if (op === '*') return '×';
  if (op === '/') return '÷';
  return op;
}
</script>
</body>
</html>
